# Tests, lint and packaging checks for Dev Charter itself, on every push and pull request.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check src tests examples
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: The package and both plugin manifests carry the same version
        run: |
          uv run --no-project python - <<'EOF'
          import json, tomllib
          package = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          for manifest in ("plugin/.claude-plugin/plugin.json", "plugin/.codex-plugin/plugin.json"):
              plugin = json.load(open(manifest))["version"]
              assert package == plugin, f"pyproject.toml says {package}, {manifest} says {plugin}"
          EOF
      - run: uv build
      - run: uvx twine check dist/*
      - name: The plugin and its marketplace are valid
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate ./plugin
